[package]
name = "free-coding-models"
version = "0.1.67"
edition = "2021"
description = "Find the fastest coding LLM models in seconds"
authors = ["vava"]
license = "MIT"
repository = "https://github.com/vava-nessa/free-coding-models"
homepage = "https://github.com/vava-nessa/free-coding-models#readme"

[[bin]]
name = "free-coding-models"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TUI
crossterm = { version = "0.27", features = ["event-stream", "screen"] }
ratatui = "0.28"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
flate2 = "1.0"
zip = "0.6"
dirs = "5.0"

# Configuration
config = "0.14"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal styling
console = "0.15"
colored = "2.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 2
